name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox
      - name: Run tests
        # Runs tox with the Python version on PATH
        run: tox -e py

  test-legacy:
    # The package still supports Python 3.6 and 3.7, which setup-python no longer
    # provides on current runners, so test them in the official Python images.
    name: Python ${{ matrix.python }} in a container
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.7"]

    steps:
      - uses: actions/checkout@v7
      - name: Install the package and pytest
        run: python -m pip install . pytest
      - name: Run tests
        run: python -m pytest tests

  package:
    # Build the sdist and wheel the same way the release workflow does, and validate the metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
